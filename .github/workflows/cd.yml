name: NYC Taxi MLOps CD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyc-taxi-production-deploy
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Push Docker Image to ECR
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::263185198493:role/nyc-taxi-github-deploy
          aws-region: eu-west-3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check whether image already exists in ECR
        id: image-check
        shell: bash
        run: |
          if aws ecr describe-images \
            --repository-name nyc-taxi-mlops \
            --image-ids imageTag=${{ github.sha }} \
            --region eu-west-3 >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists. Reusing it."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.image-check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/nyc-taxi-mlops:${{ github.sha }}

  deploy:
    name: Deploy Docker Image to EC2
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::263185198493:role/nyc-taxi-github-deploy
          aws-region: eu-west-3

      - name: Check EC2 availability
        id: ec2
        shell: bash
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids i-0452d02760af20976 \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          echo "EC2 state: $STATE"

          if [[ "$STATE" == "running" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "EC2 is stopped. Skipping deployment."
          fi

      - name: Deploy through AWS Systems Manager
        if: steps.ec2.outputs.ready == 'true'
        shell: bash
        env:
          IMAGE: 263185198493.dkr.ecr.eu-west-3.amazonaws.com/nyc-taxi-mlops:${{ github.sha }}
          REGISTRY: 263185198493.dkr.ecr.eu-west-3.amazonaws.com
          MODEL_URI: s3://nyc-taxi-mlops-artifacts-263185198493-eu-west-3-an/mlflow-artifacts/nyc-taxi-trip-duration-s3/champion/
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          import subprocess

          registry = os.environ["REGISTRY"]
          image = os.environ["IMAGE"]
          model = os.environ["MODEL_URI"]

          commands = [
              "set -e",
              f"aws ecr get-login-password --region eu-west-3 | docker login --username AWS --password-stdin {registry}",
              f"docker pull {image}",
              "docker rm -f nyc-taxi-api 2>/dev/null || true",
              f"docker run -d --name nyc-taxi-api --restart unless-stopped "
              f"--memory 1500m -p 127.0.0.1:8001:8000 "
              f"-e MLFLOW_MODEL_URI={model} "
              f"-e AWS_DEFAULT_REGION=eu-west-3 "
              f"-e AWS_EC2_METADATA_DISABLED=false {image}",
              "sleep 15",
              "curl --fail --silent --show-error --max-time 120 http://127.0.0.1:8001/health",
          ]

          command_id = subprocess.check_output([
              "aws", "ssm", "send-command",
              "--instance-ids", "i-0452d02760af20976",
              "--document-name", "AWS-RunShellScript",
              "--parameters", json.dumps({"commands": commands}),
              "--query", "Command.CommandId",
              "--output", "text",
          ], text=True).strip()

          print("SSM Command ID:", command_id, flush=True)

          result = subprocess.run([
              "aws", "ssm", "wait", "command-executed",
              "--command-id", command_id,
              "--instance-id", "i-0452d02760af20976",
          ])

          subprocess.run([
              "aws", "ssm", "get-command-invocation",
              "--command-id", command_id,
              "--instance-id", "i-0452d02760af20976",
              "--query", "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}",
              "--output", "json",
          ], check=True)

          if result.returncode != 0:
              raise SystemExit("EC2 deployment failed")
          PYCODE
