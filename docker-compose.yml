
services:
  api:
    build: .
    environment:
      MLFLOW_MODEL_URI: "s3://nyc-taxi-mlops-artifacts-263185198493-eu-west-3-an/mlflow-artifacts/nyc-taxi-trip-duration-s3/champion/"
      AWS_DEFAULT_REGION: "eu-west-3"
      AWS_EC2_METADATA_DISABLED: "false"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.2
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
